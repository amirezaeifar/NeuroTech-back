name: Backend CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: neurotech_test
          MARIADB_USER: neurotech_test
          MARIADB_PASSWORD: neurotech_test_ci
          MARIADB_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      TEST_DATABASE_URL: mysql+pymysql://neurotech_test:neurotech_test_ci@127.0.0.1:3306/neurotech_test?charset=utf8mb4
      INTEGRATION_DATABASE_URL: mysql+pymysql://neurotech_test:neurotech_test_ci@127.0.0.1:3306/neurotech_test?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_NAMESPACE: neurotech:test:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check .
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest --cov-report=term-missing --cov-report=json:.coverage-report.json
      - run: python scripts/check_layer_coverage.py
